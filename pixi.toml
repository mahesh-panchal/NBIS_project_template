[workspace]
name = "nbis-project-template"
version = "0.1.0"
description = "NBIS support project template"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[activation.env]
# Local default container cache; analyses/*/run_nextflow.sh overrides this
# on HPC clusters with a separate storage allocation (see nobackup/).
NXF_APPTAINER_CACHEDIR = "$PIXI_PROJECT_ROOT/scratch/apptainer-cache"

[dependencies]
nextflow = "*"
nf-core = "*"
quarto = "*"

[tasks.closing-report]
cmd = "quarto render closing_report.qmd"
cwd = "docs/closing_report"
description = "Render the closing report to a self-contained HTML file"

[tasks.git-link-template]
cmd = "git remote add template https://github.com/NBISweden/NBIS_project_template"
description = "Add the upstream project template repository as a git remote"

[tasks.git-merge-template]
cmd = """
git fetch template
git merge --allow-unrelated-histories --squash template/main
"""
description = "Stage changes from the upstream template as a single commit (review and commit yourself; --squash keeps the template's own history out of this repo's log)"
