[workspace]
name = "nbis-project-template"
version = "0.1.0"
description = "NBIS support project template"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[activation.env]
# Container cache, shared by every analysis (see scratch/).
NXF_APPTAINER_CACHEDIR = "$PIXI_PROJECT_ROOT/scratch/apptainer-cache"

[dependencies]
nextflow = "*"
nf-core = "*"
quarto = "*"
nf-test = ">=0.9.5,<0.10"

[tasks."01-fetch-source-data"]
cmd = "./fetch_source_data.sh"
cwd = "analyses/01_fetch-source-data"
description = "Fetch the small nf-core test dataset used by 02-workflow-dev"

[tasks."02-workflow-dev"]
cmd = "./run_nextflow.sh"
cwd = "analyses/02_workflow_dev"
description = "Run the workflow-dev analysis (test data)"

[tasks.closing-report]
cmd = "quarto render closing_report.qmd"
cwd = "docs/closing_report"
description = "Render the closing report to a self-contained HTML file"

[tasks.git-link-template]
cmd = "git remote add template https://github.com/NBISweden/NBIS_project_template"
description = "Add the upstream project template repository as a git remote"

[tasks.git-merge-template]
cmd = """
git fetch template
git merge --allow-unrelated-histories --squash template/main
"""
description = "Stage changes from the upstream template as a single commit (review and commit yourself; --squash keeps the template's own history out of this repo's log)"

[tasks.git-link-hpc]
args = ["address"]
cmd = "git remote add hpc {{ address }}"
description = "Record the HPC clone's SSH address as a git remote, e.g. user@host:/proj/naiss20XX-YY-ZZ/<project_root> - for `git fetch hpc`/rsync addressing only, never `git push hpc` (see docs/advice/how_to.md)"

[tasks.fetch-results]
args = [
    { arg = "analysis", default = "02_workflow_dev" },
    { arg = "opts", default = "" },
]
cmd = """
rsync -av {{ opts }} \
"$(git remote get-url hpc)/data/results/{{ analysis }}/" \
"data/results/{{ analysis }}/"
"""
description = "Fetch an analysis's results from the HPC clone (git-link-hpc first)"

[tasks.nextflow-clean]
args = ["dir"]
cmd = """
cd {{ dir }} && \
nextflow clean -f -before last && \
find "${PWD/analyses/scratch}/nxf-work" -type d -empty -delete
"""
description = "Periodically prune an analysis folder's Nextflow cache/work dir, e.g. `pixi run nextflow-clean analyses/02_workflow_dev` (independent of any run; not tied to a specific analysis)"
